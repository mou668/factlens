<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Verity AI Shield Logo">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172A"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagonal Shield Outline -->
  <path class="shield-bg" d="M50 8 L85 24 V52 C85 73.5 69.8 90.2 50 96 C30.2 90.2 15 73.5 15 52 V24 L50 8 Z" fill="url(#shieldGrad)" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- Inner Precision Tech Ring -->
  <path class="tech-ring" d="M50 16 A34 34 0 1 1 49.9 16" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- V-Crest Truth Mark -->
  <path class="v-mark" d="M30 35 L50 68 L70 35 M50 68 V78" stroke="url(#vGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)"/>

  <!-- Neural Connection Nodes -->
  <circle class="node-dot" cx="30" cy="35" r="4" fill="#00F0FF"/>
  <circle class="node-dot" cx="70" cy="35" r="4" fill="#8B5CF6"/>
  <circle class="node-dot" cx="50" cy="68" r="4.5" fill="#00F0FF"/>
  <circle class="node-dot" cx="50" cy="22" r="3" fill="#00F0FF" opacity="0.8"/>
</svg>
